<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="main">
        <div class="container">
            <h2>Currency Converter</h2>
            <form>
                <div class="amount">
                    <p>Enter Amount</p>
                    <input name="amount" value="1" type="number">
                </div>
                <div class="dropdown">
                    <div class="from">
                        <p>From</p>
                        <div class="select-box">
                            <img src="https://flagsapi.com/US/flat/64.png">
                            <select name="from">
                            </select>
                        </div>
                    </div>
                    <i class="bi bi-currency-exchange" id="change"></i>
                    <div class="to">
                        <p>To</p>
                        <div class="select-box">
                            <img src="https://flagsapi.com/IN/flat/64.png">
                            <select name="to">
                            </select>
                        </div>
                    </div>
                </div>
                <div class="msg"></div>
                <button class="submit">Exchange</button>
            </form>
        </div>
    </div>
    <div class="footer">
        <p>By Aanchal with &#10083;</p>
    </div>
    <script src="codes.js"></script>
    <script src="script.js"></script>
</body>
</html>
