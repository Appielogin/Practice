<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="main">
        <div class="todo-container">
            <h2>Smart To-Do List</h2>
            <div class="input-section">
                <input type="text" id="taskInput" placeholder="Enter a task">
                <button id="addBtn">Add</button>
            </div>

            <p class="error" id="taskError"></p>

            <ul id="taskList"></ul>
        
            <p id="emptyMessage" style="display: none; text-align: center; margin-top: 10px;">
                No tasks yet.
            </p>

            <p id="taskStats"></p>

            <button id="clearAllBtn">Clear All</button>

            <div class="filters">
                <button id="allBtn">All</button>
                <button id="completedBtn">Completed</button>
                <button id="pendingBtn">Pending</button>
            </div>
        </div>

        <div class="info">
            <h2>Smart To-Do App</h2>
            <p>A simple productivity app built by JavaScript.
                <ul>
                    <li>Add tasks.</li>
                    <li>Delete tasks.</li>
                    <li>Filter (All / Completed / Pending).</li>
                    <li>Local Storage Support.</li>
                </ul>
            </p>
            <p id="author">Built by Aanchal with &#10083;</p>
            <a href="#" class="githubBtn">View Code</a>
        </div>
    </div>
</body>
</html>
